---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^ansible/vault\.yml$
      - id: check-merge-conflict

  - repo: local
    hooks:
      # the repo is public and the vault holds the live bot token: check-yaml
      # accepts plaintext, so refuse anything without the vault header
      - id: vault-encrypted
        name: ansible vault is encrypted
        entry: sh -c 'head -1 ansible/vault.yml | grep -q "^\$ANSIBLE_VAULT" || { echo "ansible/vault.yml is NOT encrypted"; exit 1; }'
        language: system
        files: ^ansible/vault\.yml$
        pass_filenames: false
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
